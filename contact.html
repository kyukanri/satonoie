<div class="page reveal">
    <h1>お問い合わせ</h1>

    <form id="contactForm"
      class="contact-form"
      action="https://formspree.io/f/xgojqwry"
      method="POST">

        <input type="hidden" name="_subject" value="HOLO BASE お問い合わせ">

        <input type="hidden"
            name="_next"
            value="thanks.html">

        <label>
            お名前 <span>*</span>
            <input
                type="text"
                name="name"
                required>
        </label>

        <label>
            メールアドレス <span>*</span>
            <input
                type="email"
                name="email"
                required>
        </label>

        <label>
            お問い合わせ内容 <span>*</span>
            <textarea
                name="message"
                rows="7"
                required></textarea>
        </label>

        <button id="submitBtn" type="submit">
            送信する
        </button>

    </form>
</div>
